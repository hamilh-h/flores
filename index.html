<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Un regalo para ti</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap');
    *{box-sizing:border-box}
    
    /* MODIFICADO: Ajuste perfecto al 100% de la pantalla sin scroll */
    body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #02080e;
        color: white;
        font-family: "DM Sans", sans-serif;
    }
    
    .app {
        width: 100vw;
        height: 100vh; /* Eliminado el min-height fijo que causaba el corte */
        max-width: 470px;
        position: relative;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 94%, #565a2f, #162d2d 35%, #061621 78%);
        box-shadow: 0 20px 80px #000;
    }
    
    @media(min-width:471px) {
        .app { border: 6px solid #172837; border-radius: 28px; height: 95vh; max-height: 880px; }
    }
    
    canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .home,.scene{position:absolute;inset:0}
    .home{z-index:5;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 46%,#213d51,#081521 63%);transition:.8s}
    .intro{transform:translateY(-3vh)}
    .eyebrow,.headline small{color:#f9d66e;letter-spacing:3px;text-transform:uppercase;font-size:10px}
    .intro h1{font:700 clamp(37px,10vw,51px)/.98 "Playfair Display";margin:15px 20px 12px;text-shadow:0 3px 20px #000}
    .intro p{margin:0 0 30px;color:#dce7e6b8;font-size:14px}
    
    .gift{position:relative;width:158px;height:121px;margin:0 auto 28px;filter:drop-shadow(0 16px 13px #0008);animation:float 2.8s ease-in-out infinite}
    .box{position:absolute;left:10px;right:10px;bottom:0;height:82px;border-radius:6px 6px 16px 16px;background:linear-gradient(115deg,#d99124,#ffd85a 48%,#eaa52c)}
    .ribbon{position:absolute;left:67px;width:24px;height:100%;z-index:2;background:linear-gradient(90deg,#fef6c2,#fffdf3,#e7b836)}
    .lid{position:absolute;z-index:3;top:28px;left:0;width:158px;height:39px;border-radius:7px;background:linear-gradient(115deg,#e9a631,#ffe16b 50%,#dc8e24);transform-origin:16% 100%;transition:.8s cubic-bezier(.2,.9,.25,1.45)}
    .lid:after{content:"";position:absolute;left:67px;top:0;width:24px;height:100%;background:#fff6bf}
    .bow{position:absolute;z-index:4;top:3px;left:50%;width:65px;height:37px;transform:translateX(-50%)}
    .bow:before,.bow:after{content:"";position:absolute;top:0;width:37px;height:27px;border:8px solid #fff6bf;border-radius:80% 25% 80% 25%}
    .bow:before{left:0;transform:rotate(23deg)}
    .bow:after{right:0;transform:scaleX(-1) rotate(23deg)}
    button{font-family:"DM Sans";cursor:pointer}
    .open{border:0;border-radius:99px;padding:15px 24px;background:linear-gradient(130deg,#fff6b8,#f9c942);font-weight:700;font-size:15px;color:#17231e;box-shadow:0 12px 28px #0006}
    
    .scene{opacity:0;transform:scale(1.08);pointer-events:none;transition:opacity .9s .28s,transform 1.1s .28s}
    .app.reveal .home{opacity:0;transform:scale(1.1);pointer-events:none}
    .app.reveal .lid{opacity:0;transform:rotate(-36deg) translate(-16px,-10px)}
    .app.reveal .scene{opacity:1;transform:none;pointer-events:auto}
    
    /* MODIFICADO: Texto adaptativo */
    .headline{position:absolute;z-index:4;top:6vh;left:18px;right:18px;text-align:center}
    .headline h2{margin:12px 0;font:700 clamp(28px, 8.5vw, 48px)/.98 "Playfair Display";color:#fff5bf;text-shadow:0 0 24px #e9b6319c}
    .headline p{margin:0;color:#e6f0e9c4;font-size:14px}
    
    .ground{position:absolute;bottom:-4vh;left:-20%;width:140%;height:25vh;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at center,#4d6a32,#1a442c 48%,#0b2723 74%)}
    
    /* MODIFICADO: Contenedor fluido */
    .garden {
        position: absolute;
        z-index: 2;
        bottom: 3vh; /* Siempre queda por encima del suelo */
        left: 50%;
        width: 100%;
        max-width: 420px;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        align-items: flex-end;
    }
    
    .flower-container {
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        opacity: 0;
        transform-origin: bottom center; 
    }

    .app.reveal .flower-container {
        animation: appearCinematic 4s 0.2s cubic-bezier(0.25, 1, 0.35, 1) forwards, 
                   bounceFloat 4s 4.2s infinite ease-in-out;
    }

    .luz-fondo {
        position: absolute;
        bottom: 30%;
        width: clamp(200px, 70vw, 320px);
        height: clamp(200px, 70vw, 320px);
        background: radial-gradient(circle, rgba(255, 230, 80, 0.8) 0%, rgba(255, 200, 0, 0) 70%);
        border-radius: 50%;
        z-index: 1;
        filter: blur(35px);
        opacity: 0;
        pointer-events: none;
    }

    .app.reveal .luz-fondo {
        animation: lightCinematic 4s 0.2s forwards, pulseLight 4s 4.2s infinite alternate ease-in-out;
    }

    /* MODIFICADO: Escala matemática perfecta para la flor */
    .image-flower {
        width: clamp(220px, 75vw, 350px); 
        max-height: 45vh; /* Evita que choque con el texto en celulares pequeños */
        object-fit: contain;
        z-index: 3;
        position: relative;
        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
        margin-bottom: clamp(-95px, -18vw, -50px); /* El solapamiento con el tallo es perfecto en cualquier pantalla */
        cursor: pointer;
        transition: transform 0.3s;
    }

    .image-flower:hover {
        transform: scale(1.03);
    }

    /* MODIFICADO: Escala matemática perfecta para el tallo */
    .tallo {
        width: clamp(140px, 50vw, 250px);
        height: auto;
        max-height: 35vh;
        z-index: 2;
        pointer-events: none;
    }

    .dance-anim {
        animation: flowerDance 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards !important;
    }

    .hint{position:absolute;z-index:4;bottom:3vh;width:100%;text-align:center;color:#fff7c8d9;font-size:13px;animation:pulse 1.7s infinite; pointer-events:none;}
    .restart{position:absolute;z-index:5;right:16px;top:17px;border:1px solid #ffffff2c;border-radius:99px;padding:8px 11px;color:#fff;background:#ffffff12;font-size:11px;backdrop-filter:blur(5px)}

    @keyframes float{50%{transform:translateY(-10px) rotate(1deg)}}
    @keyframes pulse{50%{opacity:.45}}
    
    @keyframes appearCinematic {
        0% { 
            opacity: 0; 
            transform: translateY(15vh) scale(0.6); 
            filter: blur(20px) brightness(0.5);
        }
        40% {
            opacity: 0.8;
            transform: translateY(-2vh) scale(1.05);
            filter: blur(5px) brightness(1.3) drop-shadow(0 0 40px rgba(255, 230, 80, 1));
        }
        100% { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
            filter: blur(0px) brightness(1) drop-shadow(0 0 15px rgba(255, 215, 0, 0.7)); 
        }
    }

    @keyframes lightCinematic {
        0% { opacity: 0; transform: scale(0.5); }
        40% { opacity: 0.9; transform: scale(1.2); }
        100% { opacity: 0.5; transform: scale(1); }
    }

    @keyframes bounceFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2vh); }
    }

    @keyframes pulseLight {
        0% { opacity: 0.4; transform: scale(0.9); }
        100% { opacity: 0.7; transform: scale(1.1); }
    }

    @keyframes flowerDance {
        0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7)); }
        25% { transform: scale(1.08) rotate(-4deg); filter: drop-shadow(0 0 25px rgba(255, 215, 0, 1)); }
        50% { transform: scale(1.08) rotate(4deg); }
        75% { transform: scale(1.03) rotate(-2deg); }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <canvas id="stars"></canvas>
    
    <audio id="musica-fondo" loop preload="auto">
      <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <section class="home">
      <div class="intro">
        <div class="gift">
          <div class="box"></div>
          <div class="ribbon"></div>
          <div class="lid"></div>
          <div class="bow"></div>
        </div>
        <span class="eyebrow">un detalle especial</span>
        <h1>Tengo algo<br>para vos</h1>
        <p>Hecho con mucho cariño ✦</p>
        <button class="open" id="open">Abrí tu regalo</button>
      </div>
    </section>
    
    <section class="scene">
      <button class="restart" id="restart">↻ Repetir</button>
      <div class="headline">
        <small>Para iluminar tu día</small>
        <h2>Feliz día de las<br>Flores Amarillas</h2>
        <p>Que nunca te falten razones para florecer.</p>
      </div>
      
      <div class="garden" id="garden">
        <div class="flower-container" id="flower-container">
          <div class="luz-fondo"></div>
          
          <img src="image_de7144.png" class="image-flower" id="magic-flower" alt="Flor Mágica Amarilla">
          
          <svg class="tallo" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
              <defs>
                  <linearGradient id="talloGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="#1B5E20" />
                      <stop offset="50%" stop-color="#4CAF50" />
                      <stop offset="100%" stop-color="#1B5E20" />
                  </linearGradient>
                  <linearGradient id="hojaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#66BB6A" />
                      <stop offset="100%" stop-color="#1B5E20" />
                  </linearGradient>
              </defs>
              <path d="M100,0 Q120,150 90,300" fill="none" stroke="url(#talloGrad)" stroke-width="12" stroke-linecap="round"/>
              <path d="M105,100 C150,70 190,100 195,130 C160,145 125,130 105,100 Z" fill="url(#hojaGrad)" stroke="#145A14" stroke-width="2"/>
              <path d="M105,100 C130,110 160,115 185,122" fill="none" stroke="#145A14" stroke-width="2"/>
              <path d="M100,180 C50,150 10,180 5,210 C40,225 75,210 100,180 Z" fill="url(#hojaGrad)" stroke="#145A14" stroke-width="2"/>
              <path d="M100,180 C75,190 45,195 20,202" fill="none" stroke="#145A14" stroke-width="2"/>
          </svg>
        </div>
      </div>
      
      <div class="ground"></div>
      <div class="hint">Tocá la flor para hacer magia ✦</div>
    </section>
    <canvas id="petals"></canvas>
  </main>
  
  <script>
    const app = document.querySelector('#app');
    const magicFlower = document.querySelector('#magic-flower');
    const musicaFondo = document.getElementById('musica-fondo');
    
    musicaFondo.volume = 0.5;

    const intentarReproducir = () => {
        if (musicaFondo.paused) {
            musicaFondo.play().catch(e => console.warn("Esperando interacción táctil para reproducir."));
        }
    };

    document.querySelector('#open').addEventListener('click', () => {
        app.classList.add('reveal');
        intentarReproducir();
    });
    
    document.body.addEventListener('click', intentarReproducir, { once: true });
    document.body.addEventListener('touchstart', intentarReproducir, { once: true });
    
    document.querySelector('#restart').addEventListener('click', () => {
        app.classList.remove('reveal');
        musicaFondo.pause();
        musicaFondo.currentTime = 0; 
    });
    
    const stars = document.querySelector('#stars'), s = stars.getContext('2d'), 
          petals = document.querySelector('#petals'), p = petals.getContext('2d');
    let pts = [], bits = [];
    
    function fit(){
      [stars,petals].forEach(c=>{c.width=innerWidth;c.height=innerHeight});
      pts=Array.from({length:48},()=>({x:Math.random()*stars.width,y:Math.random()*stars.height,a:Math.random(),v:.004+Math.random()*.012,r:.4+Math.random()*1.6}))
    }
    fit(); addEventListener('resize',fit);
    
    function draw(){
      s.clearRect(0,0,stars.width,stars.height);
      pts.forEach(q=>{q.a+=q.v;if(q.a>1||q.a<.2)q.v*=-1;s.beginPath();s.arc(q.x,q.y,q.r,0,7);s.fillStyle='rgba(255,250,205,'+q.a+')';s.fill()});
      
      p.clearRect(0,0,petals.width,petals.height);
      bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.018;b.r+=b.vr;b.life-=.012;p.save();p.translate(b.x,b.y);p.rotate(b.r);p.globalAlpha=Math.max(0,b.life);p.fillStyle='#ffe057';p.beginPath();p.ellipse(0,0,3.7,8,.5,0,7);p.fill();p.restore()});
      bits=bits.filter(b=>b.life>0);
      requestAnimationFrame(draw);
    }
    draw();
    
    magicFlower.addEventListener('click', (e) => {
      e.stopPropagation(); 
      intentarReproducir();

      magicFlower.classList.remove('dance-anim');
      void magicFlower.offsetWidth; 
      magicFlower.classList.add('dance-anim');
      
      for(let i=0; i<80; i++) {
          bits.push({
              x: petals.width/2 + (Math.random() - .5) * 200,
              y: petals.height * .49,
              vx: (Math.random() - .5) * 7,
              vy: -Math.random() * 7 - 2,
              r: 0,
              vr: (Math.random() - .5) * .3,
              life: 1.5
          });
      }
    });
  </script>
</body>
</html>
